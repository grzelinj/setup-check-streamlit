name: Keep Streamlit demo awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Visit app and wake it up if sleeping
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://grzelinj-setup-check-streamlit-app-itfuqx.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="networkidle", timeout=60000)
              try:
                  page.get_by_text("get this app back up", exact=False).click(timeout=5000)
                  page.wait_for_timeout(15000)
              except Exception:
                  pass
              browser.close()
          PY
